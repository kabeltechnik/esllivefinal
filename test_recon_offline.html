<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>rc_recon Testseite</title>
<meta name="app-version" content="test-1.0">
<style>
  body { font: 14px/1.5 Segoe UI, sans-serif; margin: 24px; background: #F4F4F4; color: #0D0D0D; }
  h1 { color: #E60000; font-size: 18px; }
  table { border-collapse: collapse; margin-top: 12px; background: #fff; }
  th, td { border: 1px solid #CCC; padding: 4px 8px; font-size: 13px; }
  button { padding: 6px 12px; margin-right: 6px; }
</style>
</head>
<body>
<h1>Testseite fuer rc_recon</h1>

<form id="filterForm" method="POST" action="/dist/scripts/get_data.rb">
  <label>Zeitraum
    <select id="daterange-list" name="daterange">
      <option value="intraday">Heute</option>
      <option value="current_week">Aktuelle Woche</option>
      <option value="current_month" selected>Aktueller Monat</option>
    </select>
  </label>
  <label>Intervall
    <select id="interval-list" name="interval">
      <option value="cumulate">Kumuliert</option>
      <option value="day">Tag</option>
    </select>
  </label>
  <input type="hidden" name="script_id_secure" value="a7f39c2b8e14d05f9c3a6b71e2d84f00">
  <input type="hidden" name="user_id" value="4711">
  <button type="button" id="btnOk">Ok</button>
  <button type="button" id="btnXhr">Per XHR laden</button>
</form>

<table id="ergebnis">
  <thead><tr><th>Agentenname</th><th>CCS-ID</th><th>Calls</th></tr></thead>
  <tbody><tr><td>Muster, Max</td><td>4711</td><td>42</td></tr></tbody>
</table>

<script>
  // Simuliert das Portal: POST per fetch mit url-encoded Body
  document.getElementById('btnOk').addEventListener('click', function () {
    var p = new URLSearchParams();
    p.append('script_id_secure', 'a7f39c2b8e14d05f9c3a6b71e2d84f00');
    p.append('user_id', '4711');
    p.append('daterange', document.getElementById('daterange-list').value);
    p.append('interval', document.getElementById('interval-list').value);
    p.append('loc_inlist', 'Alanya');
    p.append('loc_inlist', 'Berlin');
    fetch('fixture_get_data.json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', 'X-Requested-With': 'XMLHttpRequest' },
      body: p
    }).then(function (r) { return r.text(); }).then(function (t) { window.__letzteAntwort = t; });
  });

  // Simuliert einen zweiten Weg: XHR mit HTML-Antwort
  document.getElementById('btnXhr').addEventListener('click', function () {
    var x = new XMLHttpRequest();
    x.open('POST', 'fixture_table.html');
    x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    x.setRequestHeader('X-Csrf-Token', 'b91d55aa7e3f4c60');
    x.send('table_type=2&show_ccsid=1&daterange=' + document.getElementById('daterange-list').value);
  });

  window.rcTestGlobal = { hinweis: 'eigene globale Variable' };
  localStorage.setItem('rcTestToken', 'ZmFrZS10b2tlbi0xMjM0NTY3ODkw');
</script>
</body>
</html>
