<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>KPI-Crawler Offline-Test (echte Portal-Fixtures)</title>
<style>
  body { font-family: Consolas, monospace; background:#111; color:#ddd; padding:16px; }
  h1 { font-size:16px; } .ok{color:#4caf50} .warn{color:#ffb300} .err{color:#f44336}
  #log div { border-bottom:1px solid #222; padding:2px 0; white-space:pre-wrap; }
  select { margin:4px; }
</style>
</head>
<body>
<h1>KPI-Crawler v3.5 Offline-Test — echte get_data.rb-Antworten aus LigalisteCodes.txt</h1>
<div id="status">Lade Fixtures...</div>
<div id="log"></div>

<!-- Nachbau der Ligaliste-UI-Elemente (fuer DOM-Fallback + Zustandserkennung) -->
<div style="display:none">
  <select id="daterange-list">
    <option value="user_defined">Benutzerdefiniert</option>
    <option value="intraday">Intraday</option>
    <option value="yesterday" selected>Gestern</option>
    <option value="current_week">Aktuelle Woche</option>
    <option value="current_month">Aktueller Monat</option>
    <option value="last_week">Letzte Woche</option>
  </select>
  <select id="interval-list">
    <option value="cumulate">kumuliert</option>
    <option value="day">Tag</option>
  </select>
  <button type="button" id="ok-button">Ok</button>
  <div id="live-table-slot"></div>
</div>

<script>
(async function(){
  const log = (m, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = m; document.getElementById('log').appendChild(d); };
  const status = m => document.getElementById('status').textContent = m;

  // ---------- Fixtures laden (echte Portal-Antworten) ----------
  const fixCW = await (await fetch('test_fixture_current_week.json')).text();   // current_week, nur 13.07.
  const fixUD = await (await fetch('test_fixture_user_defined.json')).text();   // 10.-15.07., 5 Tage
  log('Fixture current_week: ' + fixCW.length + ' Zeichen');
  log('Fixture user_defined: ' + fixUD.length + ' Zeichen');

  // Live-Tabelle im DOM = Tabelle aus der current_week-Antwort (gekuerzt auf 30 Zeilen)
  const html = JSON.parse(fixCW)[0].data;
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const t = doc.querySelector('table');
  Array.from(t.querySelectorAll('tbody tr')).slice(30).forEach(tr => tr.remove());
  document.getElementById('live-table-slot').appendChild(t);
  log('Live-Tabelle im DOM: ' + t.querySelectorAll('tbody tr').length + ' Zeilen');

  // ---------- get_data.rb-Mock: antwortet mit echten Fixtures je nach daterange ----------
  window.__rcTestRequests = [];
  const realFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    const url = (typeof input === 'string') ? input : (input && input.url) || '';
    if (url.indexOf('get_data.rb') !== -1) {
      const p = new URLSearchParams((init && init.body) || '');
      const dr = p.get('daterange'), iv = p.get('interval');
      window.__rcTestRequests.push({ daterange: dr, interval: iv, startdate: p.get('startdate'), enddate: p.get('enddate') });
      log('MOCK get_data.rb <- daterange=' + dr + ' interval=' + iv + ' startdate=' + p.get('startdate') + ' enddate=' + p.get('enddate'));
      let body = null;
      if (dr === 'current_week') body = fixCW;
      else if (dr === 'last_week') body = fixUD;              // stellvertretend: Mehrtages-Antwort
      else if (dr === 'user_defined') {
        // Portal akzeptiert nur ISO YYYY-MM-DD (Annahme streng): DE-Format -> leere Tabelle
        const sd = p.get('startdate') || '';
        body = /^\d{4}-\d{2}-\d{2}$/.test(sd) ? fixUD : '[{"data": "<table id=\'result-table\'></table>"}]';
      }
      else body = fixCW; // yesterday etc.
      return Promise.resolve(new Response(body, { status: 200, headers: { 'content-type':'application/json' } }));
    }
    return realFetch(input, init);
  };

  // Mitgeschnittene Original-Anfrage simulieren (wie im echten Portal nach OK-Klick)
  window.__rcLastGetData = {
    url: 'https://ccs.vodafone.de/prime/dist/scripts/get_data.rb',
    body: 'type=get-result&script_id=11035&script_id_secure=TESTTOKEN&user_id=99999&loc_inlist=AL%2CB%2CSER&figure_list=1%2C2%2C3&daterange=yesterday&interval=cumulate&startdate=undefined&enddate=undefined&show_ccsid=1&table_type=2'
  };

  // Dashboard-Empfaenger simulieren
  const bc = new BroadcastChannel('regiocom_live_arena');
  window.__rcReceived = [];
  bc.onmessage = ev => {
    const d = ev.data || {};
    if (d.type === 'KPI_BATCH') {
      const days = d.history ? Object.keys(d.history).sort() : [];
      window.__rcReceived.push({ n: (d.payload||[]).length, days });
      log('DASHBOARD-EMPFANG: ' + (d.payload||[]).length + ' Live-Zeilen · Historie-Tage: [' + days.join(', ') + ']', days.length > 1 ? 'ok' : 'warn');
      const h = d.history || {};
      days.forEach(k => log('   ' + k + ': ' + Object.keys((h[k]||{}).byAgent||{}).length + ' Agenten, ' + ((h[k]||{}).tot||{}).calls + ' Calls'));
    }
    if (d.type === 'RC_HARVEST_RANGE_DONE') {
      log('RANGE-DONE: Tage [' + (d.days||[]).join(', ') + '] Fehler: ' + (d.error || 'keiner'), (d.days||[]).length ? 'ok' : 'err');
    }
  };

  localStorage.removeItem('rcLigaHistory'); // sauberer Start
  status('Fixtures bereit — Crawler wird injiziert...');

  // ---------- Crawler laden ----------
  const s = document.createElement('script');
  s.src = 'kpi_crawler.js?' + Date.now();
  s.onload = () => { log('kpi_crawler.js injiziert', 'ok'); status('Crawler laeuft — warte auf Harvest (ca. 8s)...'); };
  s.onerror = () => { log('kpi_crawler.js LADEFEHLER', 'err'); };
  document.body.appendChild(s);

  // Nach dem Wochen-Harvest: Bereichs-Kommando testen (wie vom Dashboard-Button)
  setTimeout(() => {
    log('SENDE RC_HARVEST_RANGE 2026-07-10 bis 2026-07-15 (wie Dashboard-Zeitraum-Button)...');
    window.postMessage({ type:'RC_HARVEST_RANGE', from:'2026-07-10', to:'2026-07-15' }, '*');
  }, 10000);

  // Ergebnis-Zusammenfassung nach 18s
  setTimeout(() => {
    const h = JSON.parse(localStorage.getItem('rcLigaHistory') || '{}');
    const days = Object.keys(h).sort();
    log('================= ERGEBNIS =================');
    log('rcLigaHistory-Tage: [' + days.join(', ') + '] (' + days.length + ')', days.length >= 5 ? 'ok' : 'err');
    days.forEach(k => log('   ' + k + ': ' + Object.keys(h[k].byAgent||{}).length + ' Agenten, tot.calls=' + (h[k].tot||{}).calls));
    log('Requests an get_data.rb: ' + JSON.stringify(window.__rcTestRequests));
    // v3.5-Checks: kein falsches Heute mehr + Range beantwortet
    const heute = new Date(), hk = heute.getFullYear()+'-'+String(heute.getMonth()+1).padStart(2,'0')+'-'+String(heute.getDate()).padStart(2,'0');
    const falschHeute = h[hk] && h[hk].tot && h[hk].tot.calls === 826; // 826 = die 30 DOM-Zeilen vom 13.07.
    log('CHECK "Gestern-als-Heute"-Bug: ' + (falschHeute ? 'NOCH DA (falsch!)' : 'behoben — DOM-Zeilen wurden dem 13.07. zugeordnet'), falschHeute ? 'err' : 'ok');
    window.__rcTestDone = { days, requests: window.__rcTestRequests, received: window.__rcReceived };
    status('TEST FERTIG — window.__rcTestDone gesetzt');
  }, 18000);
})();
</script>
</body>
</html>
