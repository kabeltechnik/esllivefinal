<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><title>Autostart-Test: Mapping ohne Dialog + KPI-Quelle</title></head>
<body>
<form id="filterForm" action="/fake-export" onsubmit="return false;">
    <input class="hasDatepicker" name="filterForm:von_input" value="">
    <input class="hasDatepicker" name="filterForm:bis_input" value="">
    <button type="submit">Suchen</button><button type="submit">Excel Export</button>
    <input type="hidden" name="javax.faces.ViewState" value="test">
</form>
<script>
(function(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  const v=p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear();
  document.querySelectorAll('.hasDatepicker').forEach(i=>i.value=v);
  // Ausgangslage wie nach einem Citrix-Neustart: NICHTS gespeichert.
  localStorage.removeItem('rcWcaMapping');
  localStorage.removeItem('rcWcaMappingXlsx');
  localStorage.removeItem('rcEslHistory');
})();
// window.open abfangen (kein echtes Popup im Test) + alert ueberwachen
window.__opens = []; window.__alerts = [];
window.open = function(url, name){ window.__opens.push({url:url, name:name}); return window.__popupErlaubt ? { closed:false, focus:function(){} } : null; };
window.alert = function(m){ window.__alerts.push(m); };
</script>
<script src="/node_modules/xlsx/dist/xlsx.full.min.js"></script>
<script>
// Genau das, was ESL_Start.cmd per Fernsteuerung einspielt
(async function(){
  const m = await (await fetch('fixture_mapping_b64.json')).json();
  window.__rcFiles = { dash:'', kpi:'', croco:'', mapping: m.b64 };
  window.__eslRows = await (await fetch('fixture_esl_real.json')).json();
  const s = document.createElement('script');
  s.src = '/esl_live_arena_v22.js?t=' + Date.now();
  document.body.appendChild(s);
})();
</script>
</body>
</html>
