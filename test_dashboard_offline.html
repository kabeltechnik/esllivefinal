<!DOCTYPE html>

<title>ESL Live-Arena v22 — Offline-Test</title>

<body>
<!-- Fake-Portal-Formular, damit das Script eine Umgebung vorfindet -->
<form id="filterForm" action="/fake-export" onsubmit="return false;">
    <input class="hasDatepicker" name="filterForm:von_input" value="">
    <input class="hasDatepicker" name="filterForm:bis_input" value="">
    <button type="submit">Suchen</button>
    <button type="submit">Excel Export</button>
    <input type="hidden" name="javax.faces.ViewState" value="test">
</form>

<script>
// Heutiges Datum in die Fake-Datumsfelder
(function(){
    const d = new Date(); const p = n => String(n).padStart(2,'0');
    const val = p(d.getDate()) + '.' + p(d.getMonth()+1) + '.' + d.getFullYear();
    document.querySelectorAll('.hasDatepicker').forEach(i => i.value = val);
})();

// ---- Test-Historie in localStorage legen (ESL-Vortage inkl. byAgent) ----
(function(){
    const p = n => String(n).padStart(2,'0');
    const hist = {};
    for (let dd = 1; dd <= 7; dd++) {
        const dt = new Date(Date.now() - dd*86400000);
        const key = dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate());
        const f = 1 + (dd % 3); // variierende Werte
        hist[key] = { rows: 100+dd*7, kontakte: 90+dd*5, ansp: 40+dd*3, bcr: 20+dd*f, nonBcr: 3, bnt: 15+dd, vvl: 8+dd,
            byStd: { B: { kontakte: 30+dd, ansp: 14+dd, bcr: 7+dd, nonBcr: 1, bnt: 5+dd, vvl: 3 },
                     AL: { kontakte: 60+dd, ansp: 26+dd, bcr: 13+dd, nonBcr: 2, bnt: 10, vvl: 5+dd } },
            byAgent: { 'VO1001': { k: 10+dd, a: 6+dd, bcr: 2+(dd%4), bnt: 2, vvl: 1 },
                       'VO1002': { k: 8+dd, a: 3, bcr: 1+(dd%2), bnt: 1, vvl: 0 } } };
    }
    localStorage.setItem('rcEslHistory', JSON.stringify(hist));
    localStorage.setItem('rcEslHistCheck', (d => d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()))(new Date()));
    localStorage.removeItem('rcWcaMapping');
})();
</script>
